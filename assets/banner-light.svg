<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bee Design Harness — the human directs; agents execute">
  <style>
    .display { font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <!-- PAPER -->
  <rect width="1280" height="300" rx="16" fill="#F4F1EC"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="15.5" stroke="#16130F" stroke-opacity="0.15"/>

  <!-- acid tag -->
  <rect x="549" y="46" width="182" height="30" rx="4" fill="#D8FF3A"/>
  <text x="640" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#16130F" class="mono">DESIGN HARNESS</text>

  <!-- wordmark: INK -->
  <text x="640" y="148" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="-1" fill="#16130F" class="display">Bee Design Harness</text>

  <!-- pink accent bar (fills only) -->
  <rect x="612" y="166" width="56" height="6" rx="3" fill="#F056A0"/>

  <!-- tagline -->
  <text x="640" y="204" text-anchor="middle" font-size="14" letter-spacing="3" fill="#8B867C" class="mono">THE HUMAN DIRECTS · AGENTS EXECUTE</text>

  <!-- traceability chain: periwinkle connectors, ink terms -->
  <text x="640" y="252" text-anchor="middle" font-size="16" letter-spacing="1" class="mono">
    <tspan fill="#16130F">quote</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#16130F">INS</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#16130F">PROB</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#16130F">FEAT</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#16130F">wireframe</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#16130F">token</tspan>
  </text>
</svg>
