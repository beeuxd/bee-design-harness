<svg width="1120" height="820" viewBox="0 0 1120 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Design Harness map: access and guidance, structured design context, sources of truth, execution layer, content, guardrails">
  <style>
    .mono { font-family: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .item { font-size: 16px; letter-spacing: 1.5px; fill: #16130F; }
    .chip { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #16130F; }
  </style>
  <rect width="1120" height="820" fill="#F4F1EC"/>

  <!-- outer: DESIGN HARNESS (pink fill — accent) -->
  <rect x="20" y="30" width="1080" height="760" rx="16" stroke="#16130F" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="48" y="16" width="166" height="30" rx="4" fill="#F056A0"/>
  <text x="131" y="36" text-anchor="middle" class="mono chip" fill="#F4F1EC">DESIGN HARNESS</text>

  <!-- ACCESS AND GUIDANCE -->
  <rect x="60" y="90" width="560" height="540" rx="12" stroke="#16130F" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="85" y="76" width="214" height="30" rx="4" fill="#D8FF3A"/>
  <text x="192" y="96" text-anchor="middle" class="mono chip">ACCESS AND GUIDANCE</text>
  <text x="92" y="156" class="mono item">DESIGN.MD</text>
  <text x="92" y="191" class="mono item">STORYBOOK MCP</text>
  <text x="92" y="226" class="mono item">AGENT SKILLS</text>
  <text x="92" y="261" class="mono item">REUSABLE LOOPS</text>

  <!-- STRUCTURED DESIGN CONTEXT -->
  <rect x="85" y="292" width="510" height="312" rx="12" stroke="#16130F" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="108" y="278" width="272" height="30" rx="4" fill="#D8FF3A"/>
  <text x="244" y="298" text-anchor="middle" class="mono chip">STRUCTURED DESIGN CONTEXT</text>
  <text x="115" y="358" class="mono item">PURPOSE &amp; USAGE</text>
  <text x="115" y="393" class="mono item">CONSTRAINTS</text>
  <text x="115" y="428" class="mono item">STATES</text>
  <text x="115" y="463" class="mono item">ACCESSIBILITY</text>
  <text x="115" y="498" class="mono item">RECIPES</text>
  <text x="115" y="533" class="mono item">TEMPLATES</text>

  <!-- SOURCE OF TRUTH (periwinkle — primary) -->
  <rect x="336" y="330" width="230" height="204" rx="12" stroke="#5660F0" stroke-width="2.5"/>
  <rect x="352" y="316" width="176" height="30" rx="4" fill="#5660F0"/>
  <text x="440" y="336" text-anchor="middle" class="mono chip" fill="#F4F1EC">SOURCE OF TRUTH</text>
  <text x="362" y="394" class="mono item">FIGMA</text>
  <text x="362" y="429" class="mono item">TOKENS</text>
  <text x="362" y="464" class="mono item">STORYBOOK</text>
  <text x="362" y="499" class="mono item">CODEBASE</text>

  <!-- EXECUTION LAYER -->
  <rect x="680" y="95" width="380" height="240" rx="12" stroke="#16130F" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="782" y="81" width="176" height="30" rx="4" fill="#D8FF3A"/>
  <text x="870" y="101" text-anchor="middle" class="mono chip">EXECUTION LAYER</text>
  <text x="708" y="161" class="mono item">CURSOR</text>
  <text x="708" y="196" class="mono item">CLAUDE CODE</text>
  <text x="708" y="231" class="mono item">CODEX</text>
