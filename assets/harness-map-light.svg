  <rect x="820" y="358" width="100" height="30" rx="4" fill="#D8FF3A"/>
  <text x="870" y="378" text-anchor="middle" class="mono chip">CONTENT</text>
  <text x="708" y="432" class="mono item">CONTENT DESIGN</text>
  <text x="708" y="467" class="mono item">CONTENT GUIDELINES</text>
  <text x="708" y="502" class="mono item">AI OUTPUT</text>

  <!-- GUARDRAILS -->
  <rect x="60" y="662" width="1000" height="94" rx="12" stroke="#16130F" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="496" y="648" width="128" height="30" rx="4" fill="#D8FF3A"/>
  <text x="560" y="668" text-anchor="middle" class="mono chip">GUARDRAILS</text>
  <text x="560" y="720" text-anchor="middle" class="mono item"><tspan>TESTING</tspan><tspan fill="#5660F0"> | </tspan><tspan>SECURITY</tspan><tspan fill="#5660F0"> | </tspan><tspan>REVIEW</tspan><tspan fill="#5660F0"> | </tspan><tspan>BRANCHING</tspan><tspan fill="#5660F0"> | </tspan><tspan>CI/CD PIPELINE</tspan></text>
</svg>
