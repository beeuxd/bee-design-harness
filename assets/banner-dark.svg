<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bee Design Harness — the human directs; agents execute">
  <style>
    .display { font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <!-- INK -->
  <rect width="1280" height="300" rx="16" fill="#16130F"/>

  <!-- acid tag -->
  <rect x="549" y="46" width="182" height="30" rx="4" fill="#D8FF3A"/>
  <text x="640" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#16130F" class="mono">DESIGN HARNESS</text>

  <!-- wordmark: PAPER -->
  <text x="640" y="148" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="-1" fill="#F4F1EC" class="display">Bee Design Harness</text>

  <!-- tagline -->
  <text x="640" y="204" text-anchor="middle" font-size="14" letter-spacing="3" fill="#8B867C" class="mono">THE HUMAN DIRECTS · AGENTS EXECUTE</text>

  <!-- pink accent rule (fills only) — divider, not underline -->
  <rect x="580" y="222" width="120" height="4" rx="2" fill="#F056A0"/>

  <!-- traceability chain: periwinkle connectors, paper terms -->
  <text x="640" y="258" text-anchor="middle" font-size="16" letter-spacing="1" class="mono">
    <tspan fill="#F4F1EC">quote</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#F4F1EC">INS</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#F4F1EC">PROB</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#F4F1EC">FEAT</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#F4F1EC">wireframe</tspan><tspan fill="#5660F0"> ── </tspan><tspan fill="#F4F1EC">token</tspan>
  </text>
</svg>
